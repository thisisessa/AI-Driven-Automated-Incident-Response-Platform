services:
  # 1. BACKGROUND LOG & THREAT INTEL COLLECTOR
  log-collector:
    build:
      context: .
      dockerfile: log-collector/Dockerfile
    container_name: enterprise_log_collector
    ports:
      - "4040:4040"
    environment:
      - ES_URL=http://elasticsearch:9200/enterprise-security-logs/_doc/
      - SPLUNK_HEC_URL=http://splunk:8088/services/collector
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
      - MISP_URL=http://misp
      - MISP_API_KEY=${MISP_API_KEY}
    volumes:
      - /var/log/auth.log:/host-logs/auth.log:ro
      - /var/log/syslog:/host-logs/syslog:ro
    depends_on:
      - elasticsearch
      - misp
    networks:
      - ir-network

  # 2. SPLUNK ENTERPRISE
  splunk:
    image: splunk/splunk:latest
    container_name: splunk
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
    ports:
      - "8000:8000"
      - "8088:8088"
    networks:
      - ir-network

  # 3. ELASTICSEARCH
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - http.host=0.0.0.0
      - transport.host=0.0.0.0
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - ir-network

  # 4. KIBANA / ELASTIC SECURITY
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    networks:
      - ir-network

  # 5. MISP REDIS CACHE
  misp-redis:
    image: redis:6-alpine
    container_name: enterprise_misp_redis
    networks:
      - ir-network

  # 6. MISP DATABASE
  misp-db:
    image: mariadb:10.6
    container_name: enterprise_misp_db
    environment:
      - MYSQL_DATABASE=misp
      - MYSQL_LOGIN=misp
      - MYSQL_USER=misp
      - MYSQL_PASSWORD=${MISP_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MISP_DB_ROOT_PASSWORD}
    volumes:
      - misp-db-data:/var/lib/mysql
    networks:
      - ir-network

  # 7. MISP THREAT INTELLIGENCE PLATFORM
  misp:
    image: ghcr.io/nukib/misp:latest
    container_name: enterprise_misp
    depends_on:
      - misp-db
      - misp-redis
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=misp-db
      - MYSQL_PORT=3306
      - MYSQL_LOGIN=misp
      - MYSQL_PASSWORD=${MISP_DB_PASSWORD}
      - MYSQL_DATABASE=misp
      - REDIS_HOST=misp-redis
      - MISP_BASEURL=http://20.127.208.107:8080
      - MISP_UUID=0a674a5a-c4cb-491d-80cf-94522858888b
      - MISP_ORG=EduQualEnterprise
      - MISP_EMAIL=admin@admin.test
    networks:
      - ir-network

  # 8. CORTEX ENRICHMENT ENGINE
  cortex:
    image: thehiveproject/cortex:3.1.8-1
    container_name: enterprise_cortex
    depends_on:
      - elasticsearch
    command:
      - --secret
      - ${CORTEX_SECRET}
      - --es-uri
      - http://elasticsearch:9200
      - --analyzer-url
      - https://download.thehive-project.org/analyzers.json
      - --responder-url
      - https://download.thehive-project.org/responders.json
      - --job-directory
      - /tmp/cortex-jobs
      - --docker-job-directory
      - /tmp/cortex-jobs
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/cortex-jobs:/tmp/cortex-jobs
    networks:
      - ir-network

  # 9. THEHIVE CASE MANAGEMENT PLATFORM
  thehive:
    image: strangebee/thehive:5.2
    container_name: enterprise_thehive
    depends_on:
      - elasticsearch
      - cortex
    environment:
      - CORTEX_PORT=9001
      - THEDEF_DEFAULT_ADMIN_USER=admin@thehive.org
      - THEDEF_DEFAULT_ADMIN_PASSWORD=${THEHIVE_ADMIN_PASSWORD}
    ports:
      - "9000:9000"
    networks:
      - ir-network

  # 10. AIRFLOW & SOAR DECISION ENGINE
  soar-orchestrator:
    build:
      context: ./soar-service
      dockerfile: Dockerfile
    container_name: enterprise_soar_engine
    command: airflow standalone
    depends_on:
      - thehive
      - cortex
      - misp
      - elasticsearch
      - splunk
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ES_URL=http://elasticsearch:9200/enterprise-security-logs/_doc/
      - SPLUNK_HEC_URL=http://splunk:8088/services/collector
      - SPLUNK_HEC_TOKEN=${SPLUNK_HEC_TOKEN}
      - THEHIVE_URL=http://thehive:9000
      - THEHIVE_API_KEY=${THEHIVE_API_KEY}
      - THEHIVE_ORG=EduQual_SOC
      - CORTEX_URL=http://cortex:9001
      - CORTEX_API_KEY=${CORTEX_API_KEY}
      - MISP_URL=http://misp:80
      - MISP_API_KEY=${MISP_API_KEY}
      - PYTHONPATH=/app:/app/ai_engine_parent
    volumes:
      - ./soar-service/dags:/opt/airflow/dags
      - ./soar-service/engine:/app/engine
      - ./soar-service/threat_simulator.py:/app/threat_simulator.py
      - ./soar-service/dags:/app/dags
      - ./ai_engine:/app/ai_engine
      - ./ai_engine:/app/ai_engine_parent/ai_engine
    ports:
      - "8085:8080"
    networks:
      - ir-network

volumes:
  es-data:
  misp-db-data:

networks:
  ir-network:
    driver: bridge
